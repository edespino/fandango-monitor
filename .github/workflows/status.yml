name: Update status page

on:
  schedule:
    # Hourly through waking hours, quiet overnight. Times are UTC; PT in
    # the comments. Most invocations are the cheap date check (~4 requests);
    # the expensive seat sweep gates itself on SEAT_SWEEP_INTERVAL and runs
    # roughly three times a day.
    #
    # Theaters are not known to publish overnight, so the small hours are
    # skipped. That is an estimate, not a documented window.
    - cron: "0 13-23 * * *"  # 6am - 4pm PT
    - cron: "0 0-6 * * *"    # 5pm - 11pm PT
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to confirm alerting works"
        type: boolean
        default: false

# Only one run at a time, so two jobs never race to commit the same page.
concurrency:
  group: status-page
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Without the previous state every run would rescan 45 days at each
      # theater. The cache keeps the run cheap.
      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Check showtimes and seats
        run: python3 fandango_monitor.py --dry-run --alerts-out alerts.json

      # Lets you confirm the alert path works without waiting for a real
      # find, which would otherwise only be proven at the moment it matters.
      - name: Add a test alert
        if: inputs.test_alert
        run: |
          jq '. + [{
            "kind": "test",
            "title": "Seat monitor test",
            "body": "Alerting works. This is not a real find.",
            "url": ""
          }]' alerts.json > alerts.tmp && mv alerts.tmp alerts.json

      # Sends only when something was actually found. Whichever provider has
      # its secrets set is used; with none set this step does nothing, so a
      # fork works without any configuration.
      - name: Send alert
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          count=$(jq 'length' alerts.json)
          echo "$count alert(s)"
          if [ "$count" -eq 0 ]; then exit 0; fi

          # Keep it inside one SMS where possible.
          text=$(jq -r '.[] | "\(.title): \(.body)"' alerts.json | head -c 900)
          link=$(jq -r '[.[] | select(.url != "")][0].url // ""' alerts.json)
          if [ -n "$link" ]; then text="$text  $link"; fi

          sent=0
          if [ -n "${TWILIO_SID:-}" ] && [ -n "${ALERT_TO:-}" ]; then
            curl -fsS -X POST \
              "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
              --data-urlencode "To=$ALERT_TO" \
              --data-urlencode "From=$TWILIO_FROM" \
              --data-urlencode "Body=$text" \
              -u "$TWILIO_SID:$TWILIO_TOKEN" > /dev/null
            echo "sent via Twilio"; sent=1
          fi
          if [ -n "${NTFY_TOPIC:-}" ]; then
            curl -fsS -H "Title: Odyssey seats" -H "Priority: high" \
              -d "$text" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            echo "sent via ntfy"; sent=1
          fi
          if [ "$sent" -eq 0 ]; then
            echo "::warning::Alerts found but no notification provider is configured"
          fi

      - name: Publish the page
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs
            git commit -m "Update seat availability"
            git push
          else
            echo "nothing changed"
          fi
