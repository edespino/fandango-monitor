name: Update status page

on:
  schedule:
    # Hourly through waking hours, quiet overnight. Times are UTC; PT in
    # the comments. Most invocations are the cheap date check (~8 requests);
    # the expensive seat sweep gates itself on SEAT_SWEEP_INTERVAL and runs
    # roughly three times a day.
    #
    # Minute 37, not 0. GitHub's scheduler is best effort with no guarantee,
    # and the top of the hour is the most contended minute by a wide margin,
    # so runs there are delayed or dropped. Five consecutive slots at :00
    # produced nothing before this was changed.
    #
    # Theaters are not known to publish overnight, so the small hours are
    # skipped. That is an estimate, not a documented window.
    - cron: "37 13-23 * * *"  # 6am - 4pm PT
    - cron: "37 0-6 * * *"    # 5pm - 11pm PT
    # TEMPORARY probe, remove once answered. The ranges above skip UTC
    # hours 7-12, so after a miss at 06:37 the next real slot was six hours
    # out. This fills that gap to find out whether GitHub's scheduler ever
    # fires for this repo, rather than waiting blind. Each run is the cheap
    # date check, about 8 requests.
    - cron: "7 8-12 * * *"
    # 12:50am PDT, asked for explicitly to watch one fire.
    - cron: "50 7 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test message to confirm alerting works"
        type: boolean
        default: false
      force_sweep:
        description: "Read every seat map now, ignoring the usual interval"
        type: boolean
        default: false

# Only one run at a time, so two jobs never race to commit the same page.
concurrency:
  group: status-page
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Without the previous state every run would rescan 45 days at each
      # theater. The cache keeps the run cheap.
      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - name: Check showtimes and seats
        run: |
          if [ "${{ inputs.force_sweep }}" = "true" ]; then
            python3 fandango_monitor.py --dry-run --once --alerts-out alerts.json
          else
            python3 fandango_monitor.py --dry-run --alerts-out alerts.json
          fi

      # Lets you confirm the alert path works without waiting for a real
      # find, which would otherwise only be proven at the moment it matters.
      - name: Add a test alert
        if: inputs.test_alert
        run: |
          jq '. + [{
            "kind": "test",
            "title": "Seat monitor test",
            "body": "Alerting works. This is not a real find.",
            "url": ""
          }]' alerts.json > alerts.tmp && mv alerts.tmp alerts.json

      # Sends only when something was actually found. Whichever provider has
      # its secrets set is used; with none set this step does nothing, so a
      # fork works without any configuration.
      - name: Send alert
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMS_EMAIL: ${{ secrets.SMS_EMAIL }}
          PUSHCUT_URL: ${{ secrets.PUSHCUT_URL }}
          PUSHCUT_KEY: ${{ secrets.PUSHCUT_KEY }}
          PUSHCUT_NOTIFICATION: ${{ secrets.PUSHCUT_NOTIFICATION }}
        run: |
          set -euo pipefail
          count=$(jq 'length' alerts.json)
          echo "$count alert(s)"
          if [ "$count" -eq 0 ]; then exit 0; fi

          # Keep it inside one SMS where possible.
          text=$(jq -r '.[] | "\(.title): \(.body)"' alerts.json | head -c 900)
          link=$(jq -r '[.[] | select(.url != "")][0].url // ""' alerts.json)
          if [ -n "$link" ]; then text="$text  $link"; fi

          sent=0
          if [ -n "${TWILIO_SID:-}" ] && [ -n "${ALERT_TO:-}" ]; then
            curl -fsS -X POST \
              "https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json" \
              --data-urlencode "To=$ALERT_TO" \
              --data-urlencode "From=$TWILIO_FROM" \
              --data-urlencode "Body=$text" \
              -u "$TWILIO_SID:$TWILIO_TOKEN" > /dev/null
            echo "sent via Twilio"; sent=1
          fi
          if [ -n "${NTFY_TOPIC:-}" ]; then
            curl -fsS -H "Title: Odyssey seats" -H "Priority: high" \
              -d "$text" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
            echo "sent via ntfy"; sent=1
          fi
          # Carrier email-to-SMS gateway, e.g. 5551234567@txt.att.net for
          # AT&T. Free and lands as a real text, but carriers have been
          # retiring these gateways, so treat it as best effort.
          if [ -n "${SMTP_USER:-}" ] && [ -n "${SMS_EMAIL:-}" ]; then
            host="${SMTP_HOST:-smtp.gmail.com}"
            {
              printf 'From: %s\r\n' "$SMTP_USER"
              printf 'To: %s\r\n' "$SMS_EMAIL"
              printf 'Subject: Odyssey seats\r\n'
              printf '\r\n'
              # Gateways truncate hard, so send the useful part first.
              printf '%s\r\n' "$(printf '%s' "$text" | head -c 300)"
            } > mail.txt
            if curl -fsS --url "smtps://$host:465" --ssl-reqd \
                 --mail-from "$SMTP_USER" --mail-rcpt "$SMS_EMAIL" \
                 --user "$SMTP_USER:$SMTP_PASS" --upload-file mail.txt > /dev/null
            then
              echo "sent via email-to-SMS"; sent=1
            else
              echo "::warning::email-to-SMS failed; the carrier gateway may be gone"
            fi
          fi
          # Pushcut. Either the per-notification webhook URL from the app,
          # or an API key plus the notification's name. The JSON body only
          # changes the text on Pushcut Pro; on the free tier the
          # notification still fires, just with its configured wording.
          if [ -n "${PUSHCUT_URL:-}" ] || [ -n "${PUSHCUT_KEY:-}" ]; then
            payload=$(jq -n --arg t "Odyssey seats" --arg x "$text" \
                        '{title: $t, text: $x}')
            if [ -n "${PUSHCUT_URL:-}" ]; then
              ok=$(curl -fsS -X POST -H 'Content-Type: application/json' \
                     -d "$payload" "$PUSHCUT_URL" > /dev/null && echo yes || echo no)
            else
              name="${PUSHCUT_NOTIFICATION:-Odyssey seats}"
              ok=$(curl -fsS -X POST -H 'Content-Type: application/json' \
                     -H "API-Key: $PUSHCUT_KEY" -d "$payload" \
                     "https://api.pushcut.io/v1/notifications/$(jq -rn --arg n "$name" '$n|@uri')" \
                     > /dev/null && echo yes || echo no)
            fi
            if [ "$ok" = "yes" ]; then
              echo "sent via Pushcut"; sent=1
            else
              echo "::warning::Pushcut send failed"
            fi
          fi
          if [ -n "${SLACK_WEBHOOK:-}" ]; then
            jq -n --arg t "$text" '{text: $t}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' \
                     -d @- "$SLACK_WEBHOOK" > /dev/null
            echo "sent via Slack"; sent=1
          fi
          if [ "$sent" -eq 0 ]; then
            echo "::warning::No push provider configured; falling back to an issue"
          fi
          # Written for the next step regardless, so the fallback still runs.
          printf '%s' "$text" > alert-text.txt

      # Always-on fallback. Needs no account and no secrets: GitHub emails the
      # repo owner and pushes to the GitHub mobile app. Guarded against
      # reopening the same alert on a later run.
      - name: Open an issue
        if: hashFiles('alert-text.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Seats: $(head -c 60 alert-text.txt | tr '\n' ' ')"
          existing=$(gh issue list --state open --label seat-alert \
                       --search "$(head -c 40 alert-text.txt)" --json number -q 'length')
          if [ "$existing" != "0" ]; then
            echo "already reported"; exit 0
          fi
          gh label create seat-alert --color B60205 --description "Found seats" \
            2>/dev/null || true
          gh issue create --title "$title" --label seat-alert \
            --body "$(cat alert-text.txt)"$'\n\n'"Found $(date -u '+%Y-%m-%d %H:%M UTC')." 

      - name: Publish the page
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs
            git commit -m "Update seat availability"
            git push
          else
            echo "nothing changed"
          fi
